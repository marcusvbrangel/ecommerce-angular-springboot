apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend-deployment
  namespace: ecommerce-ns
  labels:
    app: ecommerce-frontend
    type: frontend
    technology: angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-frontend
      type: frontend
      technology: angular
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      name: ecommerce-frontend-deployment
      labels:
        app: ecommerce-frontend
        type: frontend
        technology: angular
    spec:
      containers:
        - name: ecommerce-frontend
          image: marcusvbrangel/ecommerce-frontend:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: BACKEND_HOST
              value: ecommerce-backend-service
