server:
  port: 80

website:
  name: Ecommerce for Production
  environmnt: prod

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_DNS}/${POSTGRES_DB}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}



