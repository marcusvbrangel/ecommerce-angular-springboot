spring:
  profiles:
    active: dev
  application:
    name: spring-boot-ecommerce
#  datasource:
#    url: jdbc:postgresql://localhost:5432/spring-ecommerce
#    driver-class-name: org.postgresql.Driver
#    username: admin
#    password: 1234
  sql:
    init:
      mode: never
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    rest:
      base-path: /api
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com:
      mvbr:
        ecommerce=INFO:




